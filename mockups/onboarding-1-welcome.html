<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375,initial-scale=1">
<title>Onboarding — Welcome</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#c8c2b8;
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;
  font-family:'Inter',system-ui,sans-serif;
}

.phone{
  width:375px;height:812px;
  background:#e6e0d6;
  position:relative;overflow:hidden;
  border-radius:40px;
  box-shadow:0 25px 80px rgba(0,0,0,.25);
}

.content{
  height:100%;display:flex;flex-direction:column;
  padding:60px 28px 40px;
  align-items:center;
  justify-content:space-between;
}

/* Top section */
.top{text-align:center;flex-shrink:0;margin-top:20px}

.brand{
  font-family:'Caveat',cursive;
  font-size:28px;font-weight:700;
  color:#3a352f;letter-spacing:.06em;
  margin-bottom:6px;
  opacity:.5;
}

.headline{
  font-size:26px;font-weight:700;
  color:#3a352f;line-height:1.25;
  margin-bottom:8px;
}

.subtitle{
  font-size:14px;color:#7a7468;
  line-height:1.5;
  max-width:280px;margin:0 auto;
}

/* Illustration area */
.illustration{
  flex:1;display:flex;
  align-items:center;justify-content:center;
  width:100%;position:relative;
  margin:24px 0;
}

.modes-wrap{
  display:flex;gap:14px;
  align-items:flex-end;
  perspective:800px;
}

.mode-card{
  width:96px;
  background:#ddd7cd;
  border-radius:16px;
  padding:14px 10px 16px;
  text-align:center;
  transition:transform .4s cubic-bezier(.2,1,.3,1),box-shadow .4s;
  box-shadow:0 4px 16px rgba(0,0,0,.06);
  position:relative;
  cursor:default;
}
.mode-card.center{
  transform:translateY(-12px) scale(1.08);
  background:#d6d0c5;
  box-shadow:0 8px 28px rgba(0,0,0,.1);
}

.mode-icon{
  width:52px;height:52px;margin:0 auto 10px;
  display:flex;align-items:center;justify-content:center;
}

.mode-label{
  font-size:11px;font-weight:600;
  color:#5e5953;letter-spacing:.04em;
  text-transform:uppercase;
}

/* Mini trackpad illustration */
.mini-pad{
  width:44px;height:30px;
  background:#c4bdb2;
  border-radius:6px;
  position:relative;
  margin:0 auto;
  border:1px solid rgba(0,0,0,.06);
}
.mini-pad::after{
  content:'';position:absolute;
  bottom:6px;left:50%;transform:translateX(-50%);
  width:20px;height:1px;background:#a9a296;border-radius:1px;
}
.mini-cursor{
  position:absolute;top:8px;left:18px;
  width:0;height:0;
  border-left:6px solid #484340;
  border-right:4px solid transparent;
  border-bottom:4px solid transparent;
  transform:rotate(-10deg);
}

/* Mini keyboard illustration */
.mini-kb{
  width:48px;height:28px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:1.5px;
  padding:3px;
  background:#c4bdb2;
  border-radius:5px;
  margin:0 auto;
}
.mini-key{
  background:#d6d0c6;
  border-radius:1.5px;
}

/* Mini split illustration */
.mini-split{
  width:44px;height:38px;
  display:flex;flex-direction:column;
  gap:2px;
  margin:0 auto;
}
.mini-split-top{
  flex:6;background:#c4bdb2;
  border-radius:5px 5px 2px 2px;
  position:relative;
  border:1px solid rgba(0,0,0,.06);
}
.mini-split-top .mini-cursor{top:6px;left:14px;transform:rotate(-10deg) scale(.8)}
.mini-split-bot{
  flex:4;background:#c4bdb2;
  border-radius:2px 2px 5px 5px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(2,1fr);
  gap:1px;padding:2px;
}
.mini-split-bot .mini-key{background:#d6d0c6;border-radius:1px}

/* Connection line */
.conn-line{
  display:flex;align-items:center;
  gap:8px;margin-top:24px;
  justify-content:center;
}
.conn-dot{
  width:6px;height:6px;
  background:#9a9488;border-radius:50%;
  animation:pulse 1.8s ease-in-out infinite;
}
.conn-dot:nth-child(2){animation-delay:.3s}
.conn-dot:nth-child(3){animation-delay:.6s}
@keyframes pulse{
  0%,100%{opacity:.25;transform:scale(.8)}
  50%{opacity:1;transform:scale(1.2)}
}
.conn-label{
  font-size:11px;color:#9a9488;font-weight:500;
  letter-spacing:.03em;
}

/* Features row */
.features{
  display:flex;gap:20px;
  justify-content:center;
  margin-top:20px;
}
.feat{text-align:center}
.feat-icon{
  font-size:18px;margin-bottom:4px;
  display:block;
  filter:grayscale(1) opacity(.6);
}
.feat-text{
  font-size:10px;color:#9a9488;
  font-weight:500;letter-spacing:.02em;
}

/* Bottom section */
.bottom{flex-shrink:0;width:100%;text-align:center}

.next-btn{
  width:100%;height:52px;
  background:#3a352f;
  color:#e6e0d6;
  border:none;border-radius:14px;
  font-family:'Inter',sans-serif;
  font-size:16px;font-weight:600;
  cursor:pointer;
  letter-spacing:.02em;
  transition:transform .2s,opacity .2s;
}
.next-btn:active{transform:scale(.97);opacity:.85}

.skip{
  margin-top:14px;
  font-size:13px;color:#9a9488;
  background:none;border:none;
  font-family:'Inter',sans-serif;
  cursor:pointer;font-weight:500;
  letter-spacing:.02em;
}

/* Dot indicators */
.dots{
  display:flex;gap:6px;
  justify-content:center;
  margin-bottom:20px;
}
.dot{
  width:7px;height:7px;
  background:#c4bdb2;
  border-radius:50%;
  transition:all .3s;
}
.dot.active{
  width:22px;border-radius:4px;
  background:#3a352f;
}

/* Entry animations */
.content>*{
  opacity:0;
  transform:translateY(20px);
  animation:fadeUp .6s cubic-bezier(.2,.8,.3,1) forwards;
}
.top{animation-delay:.1s}
.illustration{animation-delay:.25s}
.features{animation-delay:.4s}
.bottom{animation-delay:.5s}
.dots{animation-delay:.55s}

@keyframes fadeUp{
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>

<div class="phone">
  <div class="content">
    <div class="top">
      <div class="brand">Mouskey</div>
      <div class="headline">Your phone, your<br>trackpad & keyboard</div>
      <div class="subtitle">Control your computer wirelessly — no apps to install, no cables needed.</div>
    </div>

    <div class="illustration">
      <div>
        <div class="modes-wrap">
          <!-- Trackpad mode -->
          <div class="mode-card">
            <div class="mode-icon">
              <div class="mini-pad">
                <div class="mini-cursor"></div>
              </div>
            </div>
            <div class="mode-label">Trackpad</div>
          </div>

          <!-- Keyboard mode -->
          <div class="mode-card center">
            <div class="mode-icon">
              <div class="mini-kb">
                <div class="mini-key"></div><div class="mini-key"></div><div class="mini-key"></div><div class="mini-key"></div><div class="mini-key"></div>
                <div class="mini-key"></div><div class="mini-key"></div><div class="mini-key"></div><div class="mini-key"></div><div class="mini-key"></div>
                <div class="mini-key"></div><div class="mini-key"></div><div class="mini-key"></div><div class="mini-key"></div><div class="mini-key"></div>
              </div>
            </div>
            <div class="mode-label">Keyboard</div>
          </div>

          <!-- Split mode -->
          <div class="mode-card">
            <div class="mode-icon">
              <div class="mini-split">
                <div class="mini-split-top"><div class="mini-cursor"></div></div>
                <div class="mini-split-bot">
                  <div class="mini-key"></div><div class="mini-key"></div><div class="mini-key"></div><div class="mini-key"></div>
                  <div class="mini-key"></div><div class="mini-key"></div><div class="mini-key"></div><div class="mini-key"></div>
                </div>
              </div>
            </div>
            <div class="mode-label">Split</div>
          </div>
        </div>

        <div class="conn-line">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9488" stroke-width="2" stroke-linecap="round"><rect x="5" y="1" width="14" height="22" rx="3"/><line x1="12" y1="18" x2="12" y2="18.01" stroke-width="3"/></svg>
          <div class="conn-dot"></div>
          <div class="conn-dot"></div>
          <div class="conn-dot"></div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9488" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="18" x2="12" y2="21"/></svg>
          <div class="conn-label">via Bluetooth</div>
        </div>

        <div class="features">
          <div class="feat"><span class="feat-icon">📡</span><span class="feat-text">No Wi-Fi</span></div>
          <div class="feat"><span class="feat-icon">💻</span><span class="feat-text">No PC app</span></div>
          <div class="feat"><span class="feat-icon">🔒</span><span class="feat-text">Private</span></div>
        </div>
      </div>
    </div>

    <div class="bottom">
      <div class="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <button class="next-btn">Get Started</button>
      <button class="skip">Skip</button>
    </div>
  </div>
</div>

</body>
</html>
